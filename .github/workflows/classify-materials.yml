name: Classify Swift materials

on:
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry files previously marked failed
        required: false
        default: false
        type: boolean
      max_materials:
        description: Maximum materials to process in this run
        required: false
        default: "25"
        type: string
  schedule:
    - cron: "17 */4 * * *"

concurrency:
  group: swift-material-classifier
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BACKEND_URL: https://swift-md-backend.onrender.com
      SWIFT_ADMIN_KEY: ${{ secrets.SWIFT_ADMIN_KEY }}
      RETRY_FAILED: ${{ inputs.retry_failed || 'false' }}
      MAX_MATERIALS: ${{ inputs.max_materials || '25' }}

    steps:
      - name: Process a paced material batch
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "$SWIFT_ADMIN_KEY" ]; then
            echo "Missing GitHub Actions secret: SWIFT_ADMIN_KEY"
            exit 1
          fi

          if ! [[ "$MAX_MATERIALS" =~ ^[1-9][0-9]*$ ]]; then
            echo "MAX_MATERIALS must be a positive whole number."
            exit 1
          fi

          if [ "$RETRY_FAILED" = "true" ]; then
            payload='{"limit":1,"retry_failed":true}'
          else
            payload='{"limit":1}'
          fi

          consecutive_errors=0

          for request_number in $(seq 1 "$MAX_MATERIALS"); do
            response_file="$(mktemp)"

            status_code="$(
              curl -sS --max-time 240                 -o "$response_file"                 -w "%{http_code}"                 -X POST "$BACKEND_URL/admin/classify-materials"                 -H "Content-Type: application/json"                 -H "x-admin-key: $SWIFT_ADMIN_KEY"                 --data "$payload"               || true
            )"

            response="$(cat "$response_file")"
            rm -f "$response_file"

            if [ "$status_code" != "200" ]; then
              consecutive_errors=$((consecutive_errors + 1))
              echo "Request error $consecutive_errors of 5. HTTP $status_code: $response"

              if [ "$consecutive_errors" -ge 5 ]; then
                echo "Stopping after five consecutive request errors."
                exit 1
              fi

              sleep 60
              continue
            fi

            consecutive_errors=0
            echo "$response" | jq -c .

            processed_count="$(printf '%s' "$response" | jq -r '.processed_count // 0')"
            deferred_count="$(printf '%s' "$response" | jq '[.processed[]? | select(.status == "deferred")] | length')"

            if [ "$processed_count" = "0" ]; then
              echo "No matching materials remain."
              exit 0
            fi

            if [ "$deferred_count" -gt 0 ]; then
              echo "Provider is cooling down. Leaving remaining work for the next scheduled run."
              exit 0
            fi

            sleep 15
          done

          echo "Reached this run's safe limit of $MAX_MATERIALS materials."
