name: Keep Swift backend awake

on:
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic.
    # Ten minutes gives a safe margin without needless request volume.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the lightweight health endpoint
        run: curl --fail --silent --show-error --max-time 30 https://swift-md-backend.onrender.com/health
